---
name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      workflow:
        required: true
        type: choice
        options:
          - lint-and-scan
          - upgrade
        description: Choose the workflow to run
        default: lint-and-scan
jobs:
  terraform-lint-and-scan:
    if: >
      github.event_name == 'push'
      || (
        github.event_name == 'pull_request'
        && (! startswith(github.head_ref, 'dependabot/terraform/'))
      ) || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'lint-and-scan')
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/terraform-lint-and-scan.yml@main
    with:
      submit-dependencies: true
      snapshot-correlator: terraform-source
      search-path: .
      terraform-version: latest
      terragrunt-version: latest
  terraform-lock-files-upgrade-and-pr-merge:
    if: >
      (
        github.event_name == 'pull_request'
        && startswith(github.head_ref, 'dependabot/terraform/')
      ) || (github.event_name == 'workflow_dispatch' && inputs.workflow == 'upgrade')
    permissions:
      contents: write
      pull-requests: write
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/terraform-dependabot-lock-upgrade-and-merge.yml@main
    with:
      terragrunt-working-directories: envs/dev
      terraform-version: latest
      terragrunt-version: latest
      search-path-for-lint-and-scan: .
      merge-pr: ${{ github.event_name == 'pull_request' }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependabot-auto-merge:
    if: >
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
      && (! startswith(github.head_ref, 'dependabot/terraform/'))
    needs:
      - terraform-lint-and-scan
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    uses: dceoy/gha-for-devops/.github/workflows/dependabot-auto-merge.yml@main
    with:
      unconditional: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
